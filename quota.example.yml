# .agents/quota.local.yml のテンプレート。
# 親プロジェクト側で `cp .agents/quota.example.yml .agents/quota.local.yml` し、
# 自分のプランの上限を手入力する（各サービスとも残量の自動照会はできないため）。
# quota.local.yml は .gitignore に追加することを推奨。

mode: balanced          # balanced | gemini-saver | local-only

# limits は省略可。書いた場合のみ Step 0 で消費量と突き合わせ、80% 超で警告する。
limits:
  gemini:  { window: "5h", requests: 100 }
  claude:  { window: "5h", usd: 5.00 }
  codex:   { window: "5h", requests: 50 }
